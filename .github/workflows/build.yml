name: test-and-build
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Bootstrap pinned URnetwork sources
        shell: bash
        run: sh scripts/bootstrap.sh
      - run: go test ./...
      - run: go test -race ./internal/auth ./internal/jump ./internal/proxy
      - run: go build -trimpath -o bin/ ./cmd/urio
      - uses: actions/upload-artifact@v4
        with:
          name: urio-${{ matrix.os }}
          path: bin/
